version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: production-service
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
      SERVICE_NAME: production-service
      SIMULATE_FAILURE: 'false'
    ports:
      - '3000:3000'
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
